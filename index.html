<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리반 캐치마인드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #fdfbf7;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden; /* 태블릿 및 모바일에서 화면 전체 스크롤 방지 */
        }
        
        /* 캔버스 드로잉 중 터치 이벤트를 이중 처리하지 않도록 설정 */
        #drawing-canvas {
            touch-action: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: white;
            border-radius: 1rem;
            cursor: crosshair;
        }

        .btn-bubbly {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-bubbly:active {
            transform: scale(0.95);
        }

        /* 색상 팔레트 선택 효과 */
        .color-btn.selected {
            border: 4px solid #1e293b;
            transform: scale(1.15);
        }

        /* 굵기 선택 효과 */
        .size-btn.selected {
            background-color: #cbd5e1;
            border: 2px solid #1e293b;
        }

        /* 룰렛 애니메이션 텍스트 */
        .roulette-text {
            animation: pop 0.2s ease-in-out infinite alternate;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); color: #f59e0b; }
        }
        
        .screen { display: none; }
        .screen.active { display: flex; }

        /* 커스텀 스크롤바 디자인 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="w-screen h-[100dvh] flex flex-col justify-between overflow-hidden">

<!-- 게임 설정 화면 -->
<div id="screen-setup" class="screen active flex-col items-center justify-center w-full h-full p-2 sm:p-4 overflow-y-auto">
    <div class="bg-white p-4 sm:p-6 md:p-8 rounded-3xl shadow-xl w-full max-w-2xl border-4 border-blue-200 my-auto max-h-[95dvh] overflow-y-auto">
        <h1 class="text-3xl sm:text-4xl md:text-5xl text-center text-blue-500 mb-4 sm:mb-6 drop-shadow-md">🎨 우리반 캐치마인드 ✏️</h1>
        
        <!-- 그림 그리는 시간 선택 -->
        <div class="mb-6">
            <h2 class="text-2xl mb-2 text-gray-700 font-bold">⏱️ 그림 그리는 시간 선택</h2>
            <div class="flex flex-wrap items-center justify-center gap-3">
                <div class="flex gap-2">
                    <button class="time-btn btn-bubbly bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-xl border-2 border-transparent" data-time="30">30초</button>
                    <button class="time-btn btn-bubbly bg-blue-100 text-blue-700 px-4 py-2 rounded-xl text-xl border-2 border-blue-400 font-bold" data-time="60">60초</button>
                    <button class="time-btn btn-bubbly bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-xl border-2 border-transparent" data-time="90">90초</button>
                    <button class="time-btn btn-bubbly bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-xl border-2 border-transparent" data-time="120">120초</button>
                </div>
                <!-- 직접 입력 창 -->
                <div class="flex items-center gap-2 bg-gray-100 p-2 px-4 rounded-xl border-2 border-gray-300">
                    <span class="text-lg text-gray-700 font-bold">직접 입력:</span>
                    <input type="number" id="time-input" min="5" max="600" value="60" class="w-20 text-center text-xl font-bold p-1 bg-white border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-400">
                    <span class="text-lg text-gray-700 font-bold">초</span>
                </div>
            </div>
        </div>

        <!-- 제시어 카테고리 선택 -->
        <div class="mb-6">
            <h2 class="text-2xl mb-2 text-gray-700 font-bold">🎨 제시어 카테고리 선택 (다중 선택 가능)</h2>
            <div class="flex flex-wrap gap-2 justify-center" id="category-options">
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '동물/생물')">🐶 동물/생물</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '음식/디저트')">🍕 음식/디저트</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '학교/교과')">🏫 학교/교과</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '💡 넌센스/말장난')">💡 넌센스/말장난</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '캐릭터/문화')">🎬 캐릭터/문화</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '스포츠/놀이')">⚽ 스포츠/놀이</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '물건/일상')">🏠 물건/일상</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '장소/자연/우주')">🌍 장소/자연/우주</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-3 py-1.5 rounded-full text-base md:text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '직업/사람')">💼 직업/사람</button>
            </div>
        </div>

        <!-- 참가자 명단 -->
        <div class="mb-6">
            <h2 class="text-2xl mb-2 text-gray-700 font-bold">👥 참가자 명단 (최소 2명)</h2>
            <div class="flex gap-2 mb-3">
                <input type="text" id="player-input" placeholder="학생 이름 입력" class="flex-1 text-xl p-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-400" onkeypress="if(event.key === 'Enter') addPlayer()">
                <button onclick="addPlayer()" class="btn-bubbly bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl text-xl font-bold shadow-md">추가</button>
            </div>
            <div id="player-list" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-3 bg-gray-50 rounded-xl min-h-[4rem] border border-gray-200">
                <!-- 플레이어 뱃지 생성 위치 -->
            </div>
        </div>

        <button onclick="startGame()" class="btn-bubbly w-full bg-blue-500 hover:bg-blue-600 text-white text-3xl font-bold py-4 rounded-2xl shadow-lg transition">
            🚀 게임 시작!
        </button>
    </div>
</div>

<!-- 출제자 뽑기 화면 -->
<div id="screen-picker" class="screen flex-col items-center justify-center w-full h-full p-4 bg-yellow-50">
    <div class="bg-white p-6 sm:p-8 md:p-10 rounded-3xl shadow-xl w-full max-w-xl text-center border-4 border-yellow-300 my-auto max-h-[95dvh] overflow-y-auto">
        <h2 class="text-2xl sm:text-3xl text-gray-500 mb-2 font-bold">다음 출제자를 뽑는 중...</h2>
        <div id="roulette-box" class="text-4xl sm:text-5xl md:text-6xl text-blue-600 font-bold my-6 sm:my-8 h-20 flex items-center justify-center">
            ???
        </div>
        
        <div id="word-reveal-box" class="hidden flex-col items-center mt-4">
            <p class="text-lg sm:text-xl text-red-500 font-bold mb-4 animate-bounce break-keep">⚠️ 다른 사람들은 눈을 감거나 고개를 돌리세요!</p>
            <button onclick="showWord()" class="btn-bubbly bg-indigo-500 hover:bg-indigo-600 text-white px-6 sm:px-8 py-3 sm:py-4 text-xl sm:text-2xl font-bold rounded-xl shadow-md mb-4 shrink-0">
                제시어 확인하기 🙈
            </button>
            
            <div id="the-word" class="hidden text-3xl sm:text-4xl md:text-5xl font-bold text-green-600 my-4 bg-green-100 px-6 sm:px-8 py-3 sm:py-4 rounded-2xl border-2 border-green-400">
                <!-- 제시어 표시 -->
            </div>
            
            <button id="btn-start-draw" onclick="enterDrawMode()" class="hidden btn-bubbly bg-pink-500 hover:bg-pink-600 text-white px-6 sm:px-8 py-3 sm:py-4 text-2xl sm:text-3xl font-bold rounded-xl shadow-md w-full mt-2 shrink-0">
                그림 그리기 시작! 🎨
            </button>
        </div>
    </div>
</div>

<!-- 그림 그리기 화면 -->
<div id="screen-draw" class="screen flex-col w-full h-full p-1 sm:p-2 bg-gray-100 justify-between">
    <!-- 상단 상태 바 -->
    <div class="flex justify-between items-center bg-white p-1.5 sm:p-3 rounded-xl sm:rounded-2xl shadow-md mb-1 sm:mb-2 shrink-0">
        <div class="text-base sm:text-xl md:text-2xl text-blue-600 font-bold flex items-center gap-1 sm:gap-2">
            <span class="hidden sm:inline">출제:</span>
            <span id="draw-current-player" class="bg-blue-100 text-blue-800 px-2 sm:px-3 py-1 rounded-lg"></span>
        </div>
        <div class="text-xl sm:text-2xl md:text-3xl font-bold text-red-500 flex items-center gap-1 sm:gap-2">
            ⏳ <span id="timer-display" class="w-8 sm:w-12 text-center">60</span><span class="hidden sm:inline">초</span>
        </div>
        <div class="text-base sm:text-xl md:text-2xl text-green-600 font-bold flex items-center gap-1 sm:gap-2">
            <span class="hidden sm:inline">제시어:</span>
            <div class="relative group">
                <span id="draw-current-word" class="bg-green-100 text-green-800 px-2 sm:px-4 py-1 rounded-lg tracking-widest font-bold"></span>
            </div>
        </div>
    </div>

    <!-- 캔버스 영역 -->
    <div class="flex-1 w-full relative mb-1 sm:mb-2 min-h-0" id="canvas-container">
        <canvas id="drawing-canvas" class="absolute top-0 left-0 w-full h-full border-2 border-gray-300"></canvas>
    </div>

    <!-- 하단 도구 바 -->
    <div class="flex flex-wrap md:flex-nowrap justify-between items-center bg-white p-1.5 sm:p-3 rounded-xl sm:rounded-2xl shadow-md gap-1.5 sm:gap-3 shrink-0">
        <!-- 색상 팔레트 영역 -->
        <div class="flex flex-wrap items-center gap-1 sm:gap-2">
            <div class="flex flex-wrap items-center gap-1 sm:gap-1.5 bg-gray-50 p-1 sm:p-2 rounded-xl border border-gray-200">
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-black selected" data-color="#000000" title="검정"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-gray-500" data-color="#6B7280" title="회색"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-red-500" data-color="#EF4444" title="빨강"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-orange-500" data-color="#F97316" title="주황"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-yellow-400" data-color="#FACC15" title="노랑"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-lime-500" data-color="#84CC16" title="연두"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-green-600" data-color="#16A34A" title="초록"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-sky-400" data-color="#38BDF8" title="하늘"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-blue-600" data-color="#2563EB" title="파랑"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-purple-600" data-color="#9333EA" title="보라"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-pink-400" data-color="#F472B6" title="분홍"></button>
                <button class="color-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-amber-800" data-color="#92400E" title="갈색"></button>
                
                <!-- 커스텀 컬러 피커 -->
                <div id="custom-color-container" class="relative flex items-center justify-center w-6 h-6 sm:w-8 sm:h-8 rounded-full border-2 border-gray-300 cursor-pointer shadow-sm hover:scale-105 transition-transform bg-gradient-to-tr from-red-500 via-green-500 to-blue-500" title="색상 직접 선택">
                    <input type="color" id="custom-color-picker" value="#000000" class="absolute inset-0 w-full h-full cursor-pointer opacity-0 z-10">
                    <span class="text-[10px] sm:text-xs text-white drop-shadow pointer-events-none z-0">🎨</span>
                </div>
            </div>

            <!-- 지우개 -->
            <button id="eraser-btn" class="color-btn btn-bubbly px-2 sm:px-3 py-1 sm:py-2 rounded-xl bg-white border-2 border-gray-300 flex items-center gap-1 text-xs sm:text-sm font-bold text-gray-700 shadow-sm hover:bg-gray-50" data-color="#FFFFFF">
                🧹 지우개
            </button>
        </div>
        
        <!-- 획 크기 & 작업 도구 영역 -->
        <div class="flex items-center gap-1 sm:gap-3 w-full md:w-auto justify-between md:justify-end mt-1 md:mt-0">
            <!-- 획 크기 선택 -->
            <div class="flex items-center gap-1 sm:gap-2 bg-gray-50 p-1 sm:p-2 rounded-xl border border-gray-200">
                <span class="hidden sm:inline text-xs font-bold text-gray-500">굵기</span>
                <div class="flex items-center gap-0.5 sm:gap-1">
                    <button class="size-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full flex justify-center items-center" data-size="2" title="매우 가늘게"><div class="w-1 h-1 bg-black rounded-full"></div></button>
                    <button class="size-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full flex justify-center items-center" data-size="5" title="가늘게"><div class="w-1.5 h-1.5 bg-black rounded-full"></div></button>
                    <button class="size-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full flex justify-center items-center selected" data-size="10" title="보통"><div class="w-2.5 h-2.5 bg-black rounded-full"></div></button>
                    <button class="size-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full flex justify-center items-center" data-size="20" title="굵게"><div class="w-4 h-4 bg-black rounded-full"></div></button>
                    <button class="size-btn btn-bubbly w-6 h-6 sm:w-8 sm:h-8 rounded-full flex justify-center items-center" data-size="35" title="매우 굵게"><div class="w-6 h-6 bg-black rounded-full"></div></button>
                </div>
                <!-- 슬라이더 미세 조절 -->
                <input type="range" id="brush-slider" min="1" max="50" value="10" class="w-16 sm:w-20 accent-blue-500 cursor-pointer" title="미세 굵기 조절">
            </div>

            <div class="flex gap-1 sm:gap-2">
                <button onclick="clearCanvas()" class="btn-bubbly bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 sm:px-3 py-1 sm:py-2 rounded-xl text-xs sm:text-base font-bold whitespace-nowrap shadow-sm">전체 지우기</button>
                <button onclick="finishDrawing()" class="btn-bubbly bg-red-500 hover:bg-red-600 text-white px-3 sm:px-5 py-1 sm:py-2 rounded-xl text-sm sm:text-lg font-bold whitespace-nowrap shadow-md">완료 / 포기</button>
            </div>
        </div>
    </div>
</div>

<!-- 그림 제시 및 정답 맞히기 화면 -->
<div id="screen-guess" class="screen flex-col items-center justify-center w-full h-full p-4 bg-orange-50">
    <div class="bg-white p-4 sm:p-6 md:p-8 rounded-3xl shadow-xl w-full max-w-4xl border-4 border-orange-300 flex flex-col items-center my-auto max-h-[95dvh] overflow-y-auto">
        <h2 class="text-2xl sm:text-3xl md:text-4xl text-gray-700 mb-1 text-center font-bold break-keep">🎨 다 같이 그림을 보고 정답을 맞춰보세요!</h2>
        <p class="text-base sm:text-lg md:text-xl text-orange-500 mb-4 font-bold">출제자는 아직 정답을 말하지 마세요 🤫</p>
        
        <div class="w-full bg-white rounded-2xl mb-4 sm:mb-6 flex justify-center items-center overflow-hidden border-2 border-gray-200 shadow-inner min-h-[150px] max-h-[45vh]">
            <img id="final-drawing-img" class="max-w-full max-h-[45vh] object-contain pointer-events-none" alt="완성된 그림" />
        </div>
        
        <button onclick="revealAnswer()" class="btn-bubbly w-full max-w-md bg-red-500 hover:bg-red-600 text-white px-4 sm:px-8 py-3 sm:py-4 rounded-2xl text-xl sm:text-2xl md:text-3xl shadow-lg font-bold transition shrink-0">
            정답 공개 및 점수 주기 🎯
        </button>
    </div>
</div>

<!-- 정답 및 점수 부여 화면 -->
<div id="screen-score" class="screen flex-col items-center justify-center w-full h-full p-4 bg-green-50 overflow-y-auto">
    <div class="bg-white p-4 sm:p-6 md:p-8 rounded-3xl shadow-xl w-full max-w-3xl border-4 border-green-300 my-auto max-h-[95dvh] flex flex-col">
        <h2 class="text-xl sm:text-2xl md:text-3xl text-center text-gray-700 mb-2 font-bold shrink-0">시간 종료! 정답은?</h2>
        <div class="text-3xl sm:text-4xl md:text-6xl text-center font-bold text-red-500 mb-4 sm:mb-6 tracking-widest bg-red-100 py-2 sm:py-4 rounded-2xl border-2 border-red-300 shadow-inner shrink-0" id="score-answer">
            <!-- 정답 표시 -->
        </div>

        <h3 class="text-lg sm:text-xl md:text-2xl text-center text-blue-600 mb-4 bg-blue-50 py-2 rounded-xl font-bold shrink-0">
            🧑‍🏫 정답을 맞힌 학생과 출제자에게 점수를 주세요!
        </h3>
        
        <div id="score-list" class="grid grid-cols-1 md:grid-cols-2 gap-2 sm:gap-3 mb-4 sm:mb-6 overflow-y-auto p-2 sm:p-3 bg-gray-50 rounded-2xl border-2 border-gray-200 flex-1">
            <!-- 점수 입력 리스트가 동적으로 생성됨 -->
        </div>

        <div class="flex flex-col sm:flex-row gap-2 sm:gap-3 shrink-0">
            <button onclick="showLeaderboard()" class="flex-1 btn-bubbly bg-indigo-500 hover:bg-indigo-600 text-white text-lg sm:text-xl md:text-2xl font-bold py-3 rounded-2xl shadow-md">
                🏆 현재 순위 보기
            </button>
            <button onclick="startNextRound()" class="flex-1 btn-bubbly bg-green-500 hover:bg-green-600 text-white text-lg sm:text-xl md:text-2xl font-bold py-3 rounded-2xl shadow-md">
                다음 출제자 뽑기 ➡️
            </button>
        </div>
    </div>
</div>

<!-- 명예의 전당 화면 -->
<div id="screen-leaderboard" class="screen flex-col items-center justify-center w-full h-full p-4 bg-purple-50">
    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl w-full max-w-xl border-4 border-purple-300 flex flex-col my-auto max-h-[95dvh]">
        <h2 class="text-3xl md:text-4xl text-center text-purple-600 mb-4 font-bold drop-shadow-sm shrink-0">🏆 명예의 전당 🏆</h2>
        
        <div id="leaderboard-list" class="flex-1 overflow-y-auto flex flex-col gap-3 mb-6 p-2 min-h-[150px]">
            <!-- 순위 목록 -->
        </div>

        <div class="flex gap-3 shrink-0">

    // Web Audio API 사운드 생성기 (외부 리소스 의존 없음)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioCtx();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'pop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'fanfare') {
                // 승리/공개 효과음
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now + idx * 0.1);
                    g.gain.setValueAtTime(0.15, now + idx * 0.1);
                    g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);
                    o.start(now + idx * 0.1);
                    o.stop(now + idx * 0.1 + 0.25);
                });
            } else if (type === 'alarm') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        } catch (e) {
            // 사운드 재생 불가 환경 예외 처리
        }

    // 화면 전환 함수
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        const target = document.getElementById(screenId);
        if (target) target.classList.add('active');
    }

    // 커스텀 모달 알림창
    function showCustomAlert(title, message, icon = '🔔') {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-message').innerText = message;
        document.getElementById('modal-icon').innerText = icon;
        document.getElementById('modal-btn-cancel').classList.add('hidden');
        
        const confirmBtn = document.getElementById('modal-btn-confirm');
        confirmBtn.onclick = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    // 커스텀 확인 창
    function showCustomConfirm(title, message, onConfirm, icon = '❓') {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-message').innerText = message;
        document.getElementById('modal-icon').innerText = icon;
        
        const cancelBtn = document.getElementById('modal-btn-cancel');
        cancelBtn.classList.remove('hidden');
        
        const confirmBtn = document.getElementById('modal-btn-confirm');
        
        confirmBtn.onclick = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (onConfirm) onConfirm();
        };

        cancelBtn.onclick = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    // 시간 설정 핸들러
    const timeInput = document.getElementById('time-input');

    function updateTimePresetHighlight(val) {
        document.querySelectorAll('.time-btn').forEach(b => {
            if (parseInt(b.getAttribute('data-time')) === val) {
                b.classList.remove('bg-gray-200', 'text-gray-700', 'border-transparent');
                b.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-400', 'font-bold');
            } else {
                b.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-400', 'font-bold');
                b.classList.add('bg-gray-200', 'text-gray-700', 'border-transparent');
            }
        });
    }

    document.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            playSound('pop');
            const val = parseInt(this.getAttribute('data-time'));
            drawingTimeSetting = val;
            if (timeInput) timeInput.value = val;
            updateTimePresetHighlight(val);
        });
    });

    if (timeInput) {
        timeInput.addEventListener('input', function() {
            let val = parseInt(this.value);
            if (!isNaN(val) && val > 0) {
                drawingTimeSetting = val;
                updateTimePresetHighlight(val);
            }
        });

        timeInput.addEventListener('change', function() {
            let val = parseInt(this.value);
            if (isNaN(val) || val < 5) val = 5; // 최소 5초
            if (val > 600) val = 600; // 최대 10분
            this.value = val;
            drawingTimeSetting = val;
            updateTimePresetHighlight(val);
        });
    }

    // 카테고리 토글
    function toggleCategory(btn, category) {
        playSound('pop');
        if (selectedCategories.includes(category)) {
            if (selectedCategories.length <= 1) {
                showCustomAlert('카테고리 선택', '최소 1개의 카테고리는 선택해야 합니다!', '⚠️');
                return;
            }
            selectedCategories = selectedCategories.filter(c => c !== category);
            btn.classList.remove('bg-purple-100', 'text-purple-700', 'border-purple-400', 'font-bold');
            btn.classList.add('bg-gray-200', 'text-gray-700', 'border-transparent');
        } else {
            selectedCategories.push(category);
            btn.classList.remove('bg-gray-200', 'text-gray-700', 'border-transparent');
            btn.classList.add('bg-purple-100', 'text-purple-700', 'border-purple-400', 'font-bold');
        }
    }

    // 플레이어 추가
    function addPlayer() {
        const input = document.getElementById('player-input');
        const name = input.value.trim();
        if (name.length === 0) return;
        
        if (players.some(p => p.name === name)) {
            showCustomAlert('참가자 등록', '이미 등록된 이름입니다.', '⚠️');
            return;
        }

        playSound('pop');
        players.push({ name: name, score: 0 });
        input.value = '';
        renderPlayerList();
    }

    // 플레이어 삭제
    function removePlayer(index) {
        playSound('pop');
        players.splice(index, 1);
        renderPlayerList();
    }

    // 플레이어 목록 UI 업데이트
    function renderPlayerList() {
        const listDiv = document.getElementById('player-list');
        listDiv.innerHTML = '';
        players.forEach((player, index) => {
            const badge = document.createElement('div');
            badge.className = 'bg-blue-500 text-white px-3.5 py-1.5 rounded-full flex items-center gap-2 shadow-sm text-lg font-bold animate-fadeIn';
            badge.innerHTML = `
                <span>${player.name}</span>
                <button onclick="removePlayer(${index})" class="text-blue-100 hover:text-red-200 font-bold ml-1 text-xl leading-none">&times;</button>
            `;
            listDiv.appendChild(badge);
        });
    }

    // 배열 섞기 (피셔-예이츠 알고리즘)
    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    // 게임 시작
    function startGame() {
        if (players.length < 2) {
            showCustomAlert('시작 불가', '게임 진행을 위해 최소 2명의 참가자를 입력해주세요!', '📢');
            return;
        }
        playSound('pop');
        orderQueue = shuffleArray([...Array(players.length).keys()]);
        startNextRound();
    }

    // 다음 라운드 준비 (출제자 뽑기 화면)
    function startNextRound() {
        if (orderQueue.length === 0) {
            orderQueue = shuffleArray([...Array(players.length).keys()]);
        }
        
        currentDrawerIndex = orderQueue.pop(); // 큐에서 출제자 추출
        
        // UI 초기화
        document.getElementById('word-reveal-box').classList.add('hidden');
        document.getElementById('the-word').classList.add('hidden');
        document.getElementById('btn-start-draw').classList.add('hidden');
        const rouletteBox = document.getElementById('roulette-box');
        rouletteBox.innerHTML = '<span class="text-gray-400">? ? ?</span>';
        
        showScreen('screen-picker');
        
        // 룰렛 연출 효과
        let ticks = 0;
        const maxTicks = 18;
        const interval = setInterval(() => {
            playSound('tick');
            const randomPlayer = players[Math.floor(Math.random() * players.length)].name;
            rouletteBox.innerHTML = `<span class="text-gray-400">${randomPlayer}</span>`;
            ticks++;
            
            if (ticks >= maxTicks) {
                clearInterval(interval);
                playSound('fanfare');
                const actualDrawerName = players[currentDrawerIndex].name;
                rouletteBox.innerHTML = `🎉 <span class="roulette-text text-blue-600">${actualDrawerName}</span> 🎉`;
                
                setTimeout(() => {
                    document.getElementById('word-reveal-box').classList.remove('hidden');
                    pickRandomWord();
                }, 800);
            }
        }, 100);
    }

    // 제시어 무작위 선출
    function pickRandomWord() {
        let availableWords = [];
        selectedCategories.forEach(cat => {
            if(wordDB[cat]) {
                availableWords = availableWords.concat(wordDB[cat]);
            }
        });
        
        if (availableWords.length === 0) {
            currentWord = "행복";
        } else {
            const randomIndex = Math.floor(Math.random() * availableWords.length);
            currentWord = availableWords[randomIndex];
        }
        
        document.getElementById('the-word').innerText = currentWord;
    }

    // 제시어 공개 버튼
    function showWord() {
        playSound('pop');
        document.getElementById('the-word').classList.remove('hidden');
        document.getElementById('btn-start-draw').classList.remove('hidden');
    }

    // 드로잉 모드 진입
    function enterDrawMode() {
        playSound('pop');
        showScreen('screen-draw');
        document.getElementById('draw-current-player').innerText = players[currentDrawerIndex].name;
        document.getElementById('draw-current-word').innerText = currentWord;
        
        timeLeft = drawingTimeSetting;
        updateTimerDisplay();
        
        initCanvas();
        clearCanvas();
        
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 5 && timeLeft > 0) {
                playSound('alarm');
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                finishDrawing();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerEl = document.getElementById('timer-display');
        if (timerEl) {
            timerEl.innerText = timeLeft;
            if (timeLeft <= 10) {
                timerEl.classList.add('text-red-600', 'animate-ping');
            } else {
                timerEl.classList.remove('text-red-600', 'animate-ping');
            }
        }
    }

    // 캔버스 초기화 및 픽셀 밀도 조정
    function initCanvas() {
        canvas = document.getElementById('drawing-canvas');
        const container = document.getElementById('canvas-container');
        
        // 컨테이너 크기에 맞춰 캔버스 크기 조정
        const rect = container.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        ctx = canvas.getContext('2d');
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 이벤트 리스너 바인딩 (Pointer Events: 터치 & 마우스 공통 대응)
        canvas.onpointerdown = startDrawing;
        canvas.onpointermove = draw;
        canvas.onpointerup = stopDrawing;
        canvas.onpointercancel = stopDrawing;
    }

    function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    function startDrawing(e) {
        isDrawing = true;
        const coords = getCanvasCoordinates(e);
        lastX = coords.x;
        lastY = coords.y;

        // 점 찍기 대응
        ctx.beginPath();
        ctx.arc(lastX, lastY, currentLineWidth / 2, 0, Math.PI * 2);
        ctx.fillStyle = currentColor;
        ctx.fill();
    }

    function draw(e) {
        if (!isDrawing) return;
        const coords = getCanvasCoordinates(e);

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(coords.x, coords.y);
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentLineWidth;
        ctx.stroke();

        lastX = coords.x;
        lastY = coords.y;
    }

    function stopDrawing() {
        isDrawing = false;
    }

    function clearCanvas() {
        if (!ctx || !canvas) return;
        playSound('pop');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 팔레트 색상 클릭 이벤트
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            playSound('pop');
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            currentColor = this.getAttribute('data-color');
        });
    });

    // 커스텀 컬러 피커
    const customPicker = document.getElementById('custom-color-picker');
    if (customPicker) {
        customPicker.addEventListener('input', function() {
            currentColor = this.value;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        });
    }

    // 획 굵기 프리셋 클릭
    document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            playSound('pop');
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            currentLineWidth = parseInt(this.getAttribute('data-size'));
            
            const slider = document.getElementById('brush-slider');
            const sizeText = document.getElementById('brush-size-text');
            if (slider) slider.value = currentLineWidth;
            if (sizeText) sizeText.innerText = currentLineWidth;
        });
    });

    // 굵기 슬라이더 조절
    const brushSlider = document.getElementById('brush-slider');
    const brushSizeText = document.getElementById('brush-size-text');
    if (brushSlider) {
        brushSlider.addEventListener('input', function() {
            currentLineWidth = parseInt(this.value);
            if (brushSizeText) brushSizeText.innerText = currentLineWidth;
            
            // 프리셋 선택 해제
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
        });
    }

    // 그림 완료 및 포기
    function finishDrawing() {
        if (timerInterval) clearInterval(timerInterval);
        playSound('fanfare');

        // 완성된 그림을 이미지 데이터로 변환
        const dataURL = canvas.toDataURL('image/png');
        document.getElementById('final-drawing-img').src = dataURL;

        showScreen('screen-guess');
    }

    // 정답 공개 버튼
    function revealAnswer() {
        playSound('fanfare');
        document.getElementById('score-answer').innerText = currentWord;
        renderScoreList();
        showScreen('screen-score');
    }

    // 점수 입력 리스트 렌더링
    function renderScoreList() {
        const container = document.getElementById('score-list');
        container.innerHTML = '';

        players.forEach((player, idx) => {
            const isDrawer = (idx === currentDrawerIndex);
            const card = document.createElement('div');
            card.className = `p-3 rounded-2xl border-2 flex items-center justify-between shadow-sm ${
                isDrawer ? 'bg-amber-50 border-amber-300' : 'bg-white border-gray-200'
            }`;

            card.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="text-xl font-bold text-gray-800">${player.name}</span>
                    ${isDrawer ? '<span class="bg-amber-400 text-white text-xs px-2 py-0.5 rounded-full font-bold">출제자</span>' : ''}
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="text-xl font-bold text-blue-600 mr-2" id="score-val-${idx}">${player.score}점</span>
                    <button onclick="changeScore(${idx}, 10)" class="btn-bubbly bg-green-500 hover:bg-green-600 text-white px-2.5 py-1 rounded-lg text-sm font-bold">+10</button>
                    <button onclick="changeScore(${idx}, 5)" class="btn-bubbly bg-blue-500 hover:bg-blue-600 text-white px-2.5 py-1 rounded-lg text-sm font-bold">+5</button>
                    <button onclick="changeScore(${idx}, 1)" class="btn-bubbly bg-sky-400 hover:bg-sky-500 text-white px-2 py-1 rounded-lg text-sm font-bold">+1</button>
                    <button onclick="changeScore(${idx}, -1)" class="btn-bubbly bg-gray-300 hover:bg-gray-400 text-gray-700 px-2 py-1 rounded-lg text-sm font-bold">-1</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function changeScore(index, delta) {
        playSound('pop');
        players[index].score += delta;
        if (players[index].score < 0) players[index].score = 0;
        
        const scoreEl = document.getElementById(`score-val-${index}`);
        if (scoreEl) scoreEl.innerText = `${players[index].score}점`;
    }

    // 리더보드 표시
    function showLeaderboard() {
        playSound('pop');
        const listDiv = document.getElementById('leaderboard-list');
        listDiv.innerHTML = '';

        // 점수 내림차순 정렬
        const sorted = [...players].sort((a, b) => b.score - a.score);

        sorted.forEach((player, idx) => {
            let medal = '🏅';
            if (idx === 0) medal = '🥇';
            else if (idx === 1) medal = '🥈';
            else if (idx === 2) medal = '🥉';

            const item = document.createElement('div');
            item.className = 'flex justify-between items-center bg-purple-50 p-3.5 rounded-2xl border-2 border-purple-200 text-xl font-bold shadow-sm';
            item.innerHTML = `
                <div class="flex items-center gap-3">
                    <span class="text-2xl">${medal}</span>
                    <span class="text-gray-800">${idx + 1}위: ${player.name}</span>
                </div>
                <span class="text-purple-700 text-2xl font-bold">${player.score}점</span>
            `;
            listDiv.appendChild(item);
        });

        showScreen('screen-leaderboard');
    }

    function backToScore() {
        playSound('pop');
        showScreen('screen-score');
    }

    function confirmEndGame() {
        showCustomConfirm(
            '게임 종료', 
            '게임을 완전히 종료하고 처음 설정 화면으로 돌아갈까요?', 
            () => {
                playSound('pop');
                players = [];
                renderPlayerList();
                showScreen('screen-setup');
            },
            '🏁'
        );
    }

    // 창 크기 변경 대응 (화면 회전 시 그림 보존)
    window.addEventListener('resize', () => {
        if (document.getElementById('screen-draw').classList.contains('active')) {
            // 기존 그림 데이터 임시 저장
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(canvas, 0, 0);

            // 캔버스 크기 재조정
            initCanvas();

            // 저장된 그림 복원
            ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, canvas.width, canvas.height);
        }
    });
</script>
</body>
</html>
