<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리반 캐치마인드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #fdfbf7;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden; /* 태블릿에서 스크롤 방지 */
        }
        
        /* 캔버스 드로잉 중 화면 밀림 방지 */
        #drawing-canvas {
            touch-action: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: white;
            border-radius: 1rem;
            cursor: crosshair;
        }

        .btn-bubbly {
            transition: transform 0.1s;
        }
        .btn-bubbly:active {
            transform: scale(0.95);
        }

        /* 색상 팔레트 선택 효과 */
        .color-btn.selected {
            border: 4px solid #333;
            transform: scale(1.1);
        }

        /* 굵기 선택 효과 */
        .size-btn.selected {
            background-color: #cbd5e1;
            border: 2px solid #333;
        }

        /* 룰렛 애니메이션 텍스트 */
        .roulette-text {
            animation: pop 0.2s ease-in-out infinite alternate;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); color: #f59e0b; }
        }
        
        .screen { display: none; }
        .screen.active { display: flex; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col">

<div id="screen-setup" class="screen active flex-col items-center justify-center w-full h-full p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-2xl border-4 border-blue-200">
        <h1 class="text-5xl text-center text-blue-500 mb-6 drop-shadow-md">🎨 우리반 캐치마인드 ✏️</h1>
        
        <!-- 그림 그리는 시간 선택 -->
        <div class="mb-6">
            <h2 class="text-2xl mb-2 text-gray-700">⏱️ 그림 그리는 시간 선택</h2>
            <div class="flex flex-wrap items-center justify-center gap-3">
                <div class="flex gap-2">
                    <button class="time-btn btn-bubbly bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-xl border-2 border-transparent" data-time="30">30초</button>
                    <button class="time-btn btn-bubbly bg-blue-100 text-blue-700 px-4 py-2 rounded-xl text-xl border-2 border-blue-400 font-bold" data-time="60">60초</button>
                    <button class="time-btn btn-bubbly bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-xl border-2 border-transparent" data-time="90">90초</button>
                    <button class="time-btn btn-bubbly bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-xl border-2 border-transparent" data-time="120">120초</button>
                </div>
                <!-- 직접 입력 창 -->
                <div class="flex items-center gap-2 bg-gray-100 p-2 px-4 rounded-xl border-2 border-gray-300">
                    <span class="text-lg text-gray-700 font-bold">직접 입력:</span>
                    <input type="number" id="time-input" min="5" max="600" value="60" class="w-20 text-center text-xl font-bold p-1 bg-white border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-400">
                    <span class="text-lg text-gray-700 font-bold">초</span>
                </div>
            </div>
        </div>

        <!-- 제시어 카테고리 선택 (단일 통합) -->
        <div class="mb-6">
            <h2 class="text-2xl mb-2 text-gray-700">🎨 제시어 카테고리 선택 (다중 선택 가능)</h2>
            <div class="flex flex-wrap gap-2 justify-center" id="category-options">
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '동물/생물')">🐶 동물/생물</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '음식/디저트')">🍕 음식/디저트</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '학교/교과')">🏫 학교/교과</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '💡 넌센스/말장난')">💡 넌센스/말장난</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '캐릭터/문화')">🎬 캐릭터/문화</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '스포츠/놀이')">⚽ 스포츠/놀이</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '물건/일상')">🏠 물건/일상</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '장소/자연/우주')">🌍 장소/자연/우주</button>
                <button class="cat-btn btn-bubbly bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-lg border-2 border-purple-400 font-bold" onclick="toggleCategory(this, '직업/사람')">💼 직업/사람</button>
            </div>
        </div>

        <div class="mb-6">
            <h2 class="text-2xl mb-2 text-gray-700">참가자 명단 (최소 2명)</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="player-input" placeholder="학생 이름 입력" class="flex-1 text-2xl p-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-400" onkeypress="if(event.key === 'Enter') addPlayer()">
                <button onclick="addPlayer()" class="btn-bubbly bg-green-400 text-white px-6 py-3 rounded-xl text-2xl shadow-md">추가</button>
            </div>
            <div id="player-list" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto p-2 bg-gray-50 rounded-xl min-h-[4rem]">
                <!-- 플레이어 뱃지 생성 위치 -->
            </div>
        </div>

        <button onclick="startGame()" class="btn-bubbly w-full bg-blue-500 hover:bg-blue-600 text-white text-3xl py-4 rounded-2xl shadow-lg mt-4">
            🚀 게임 시작!
        </button>
    </div>
</div>

<div id="screen-picker" class="screen flex-col items-center justify-center w-full h-full p-4 bg-yellow-50">
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-xl text-center border-4 border-yellow-300">
        <h2 class="text-3xl text-gray-500 mb-4">다음 출제자를 뽑는 중...</h2>
        <div id="roulette-box" class="text-6xl text-blue-600 font-bold my-10 h-20 flex items-center justify-center">
            ???
        </div>
        
        <div id="word-reveal-box" class="hidden flex-col items-center mt-6">
            <p class="text-xl text-red-500 mb-2">⚠️ 다른 사람들은 눈을 감거나 고개를 돌리세요!</p>
            <button onclick="showWord()" class="btn-bubbly bg-indigo-500 text-white px-8 py-4 text-2xl rounded-xl shadow-md mb-4">
                제시어 확인하기 🙈
            </button>
            
            <div id="the-word" class="hidden text-5xl font-bold text-green-600 my-6 bg-green-100 px-8 py-4 rounded-2xl border-2 border-green-400">
                <!-- 제시어 표시 -->
            </div>
            
            <button id="btn-start-draw" onclick="enterDrawMode()" class="hidden btn-bubbly bg-pink-500 text-white px-8 py-4 text-3xl rounded-xl shadow-md w-full">
                그림 그리기 시작! 🎨
            </button>
        </div>
    </div>
</div>

<div id="screen-draw" class="screen flex-col w-full h-full p-2 bg-gray-100">
    <!-- 상단 바 -->
    <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm mb-2">
        <div class="text-2xl text-blue-600 font-bold flex items-center gap-2">
            <span>출제:</span>
            <span id="draw-current-player" class="bg-blue-100 px-3 py-1 rounded-lg"></span>
        </div>
        <div class="text-3xl font-bold text-red-500 flex items-center gap-2">
            ⏳ <span id="timer-display">60</span>
        </div>
        <div class="text-2xl text-green-600 font-bold flex items-center gap-2">
            <span>제시어:</span>
            <span id="draw-current-word" class="bg-green-100 px-4 py-1 rounded-lg tracking-widest text-3xl"></span>
        </div>
    </div>

    <!-- 캔버스 영역 -->
    <div class="flex-1 w-full relative mb-2" id="canvas-container">
        <canvas id="drawing-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
    </div>

    <!-- 도구 바 -->
    <div class="flex flex-wrap md:flex-nowrap justify-between items-center bg-white p-3 rounded-2xl shadow-sm gap-3">
        <!-- 색상 팔레트 영역 -->
        <div class="flex flex-wrap items-center gap-2">
            <div class="flex flex-wrap items-center gap-1.5 bg-gray-50 p-2 rounded-xl border border-gray-200">
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-black selected" data-color="#000000" title="검정"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-gray-500" data-color="#6B7280" title="회색"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-red-500" data-color="#EF4444" title="빨강"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-orange-500" data-color="#F97316" title="주황"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-yellow-400" data-color="#FACC15" title="노랑"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-lime-500" data-color="#84CC16" title="연두"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-green-600" data-color="#16A34A" title="초록"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-sky-400" data-color="#38BDF8" title="하늘"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-blue-600" data-color="#2563EB" title="파랑"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-purple-600" data-color="#9333EA" title="보라"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-pink-400" data-color="#F472B6" title="분홍"></button>
                <button class="color-btn btn-bubbly w-8 h-8 rounded-full bg-amber-800" data-color="#92400E" title="갈색"></button>
                
                <!-- 커스텀 컬러 피커 -->
                <div id="custom-color-container" class="relative flex items-center justify-center w-8 h-8 rounded-full border-2 border-gray-300 cursor-pointer shadow-sm hover:scale-105 transition-transform bg-gradient-to-tr from-red-500 via-green-500 to-blue-500" title="색상 직접 선택">
                    <input type="color" id="custom-color-picker" value="#000000" class="absolute inset-0 w-full h-full cursor-pointer opacity-0 z-10">
                    <span class="text-xs text-white drop-shadow pointer-events-none z-0">🎨</span>
                </div>
            </div>

            <!-- 지우개 -->
            <button class="color-btn btn-bubbly px-3 py-1.5 rounded-xl bg-white border-2 border-gray-300 flex items-center gap-1 text-sm font-bold text-gray-700 shadow-sm" data-color="#FFFFFF">
                🧹 지우개
            </button>
        </div>
        
        <!-- 획 크기 & 작업 도구 영역 -->
        <div class="flex items-center gap-3">
            <!-- 획 크기 선택 -->
            <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border border-gray-200">
                <span class="text-xs font-bold text-gray-500">굵기</span>
                <div class="flex items-center gap-1">
                    <button class="size-btn btn-bubbly w-8 h-8 rounded-full flex justify-center items-center" data-size="2" title="매우 가늘게"><div class="w-1 h-1 bg-black rounded-full"></div></button>
                    <button class="size-btn btn-bubbly w-8 h-8 rounded-full flex justify-center items-center" data-size="5" title="가늘게"><div class="w-1.5 h-1.5 bg-black rounded-full"></div></button>
                    <button class="size-btn btn-bubbly w-8 h-8 rounded-full flex justify-center items-center selected" data-size="10" title="보통"><div class="w-2.5 h-2.5 bg-black rounded-full"></div></button>
                    <button class="size-btn btn-bubbly w-8 h-8 rounded-full flex justify-center items-center" data-size="20" title="굵게"><div class="w-4 h-4 bg-black rounded-full"></div></button>
                    <button class="size-btn btn-bubbly w-8 h-8 rounded-full flex justify-center items-center" data-size="35" title="매우 굵게"><div class="w-6 h-6 bg-black rounded-full"></div></button>
                </div>
                <!-- 슬라이더 미세 조절 -->
                <input type="range" id="brush-slider" min="1" max="50" value="10" class="w-20 accent-blue-500 cursor-pointer" title="미세 굵기 조절">
                <span id="brush-size-text" class="text-xs font-bold text-blue-600 w-5 text-center">10</span>
            </div>

            <button onclick="clearCanvas()" class="btn-bubbly bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-xl text-base font-bold whitespace-nowrap">전체 지우기</button>
            <button onclick="finishDrawing()" class="btn-bubbly bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-xl text-lg font-bold whitespace-nowrap">완료 / 포기</button>
        </div>
    </div>
</div>

<div id="screen-guess" class="screen flex-col items-center justify-center w-full h-full p-4 bg-orange-50">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-4xl border-4 border-orange-300 flex flex-col items-center">
        <h2 class="text-4xl text-gray-700 mb-2 text-center break-keep">🎨 다 같이 그림을 보고 정답을 맞춰보세요!</h2>
        <p class="text-xl text-orange-500 mb-6">출제자는 아직 정답을 말하지 마세요 🤫</p>
        
        <div class="w-full bg-white rounded-xl mb-8 flex justify-center items-center overflow-hidden border-2 border-gray-200 shadow-inner" style="height: 50vh;">
            <img id="final-drawing-img" class="max-w-full max-h-full object-contain pointer-events-none" alt="완성된 그림" />
        </div>
        
        <button onclick="revealAnswer()" class="btn-bubbly w-full max-w-md bg-red-500 hover:bg-red-600 text-white px-8 py-5 rounded-2xl text-3xl shadow-lg font-bold">
            정답 공개 및 점수 주기 🎯
        </button>
    </div>
</div>

<div id="screen-score" class="screen flex-col items-center justify-center w-full h-full p-4 bg-green-50">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-3xl border-4 border-green-300">
        <h2 class="text-3xl text-center text-gray-700 mb-2">시간 종료! 정답은?</h2>
        <div class="text-6xl text-center font-bold text-red-500 mb-8 tracking-widest bg-red-100 py-4 rounded-xl" id="score-answer">
            <!-- 정답 표시 -->
        </div>

        <h3 class="text-2xl text-center text-blue-600 mb-4 bg-blue-50 py-2 rounded-lg">
            🧑‍🏫 정답을 맞힌 학생과 출제자에게 점수를 주세요!
        </h3>
        
        <div id="score-list" class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8 max-h-[40vh] overflow-y-auto p-4 bg-gray-50 rounded-2xl border-2 border-gray-200">
            <!-- 점수 입력 리스트가 동적으로 생성됨 -->
        </div>

        <div class="flex gap-4">
            <button onclick="showLeaderboard()" class="flex-1 btn-bubbly bg-indigo-500 text-white text-2xl py-4 rounded-2xl shadow-md">
                🏆 현재 순위 보기
            </button>
            <button onclick="startNextRound()" class="flex-1 btn-bubbly bg-green-500 text-white text-2xl py-4 rounded-2xl shadow-md">
                다음 출제자 뽑기 ➡️
            </button>
        </div>
    </div>
</div>

<div id="screen-leaderboard" class="screen flex-col items-center justify-center w-full h-full p-4 bg-purple-50">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-xl border-4 border-purple-300 flex flex-col max-h-[90vh]">
        <h2 class="text-4xl text-center text-purple-600 mb-6 drop-shadow-sm">🏆 명예의 전당 🏆</h2>
        
        <div id="leaderboard-list" class="flex-1 overflow-y-auto flex flex-col gap-3 mb-6 p-2">
            <!-- 순위 목록 -->
        </div>

        <div class="flex gap-4">
            <button onclick="backToScore()" id="btn-back-to-score" class="flex-1 btn-bubbly bg-gray-400 text-white text-2xl py-3 rounded-2xl shadow-md">
                돌아가기
            </button>
            <button onclick="confirmEndGame()" class="flex-1 btn-bubbly bg-red-500 text-white text-2xl py-3 rounded-2xl shadow-md">
                게임 완전히 끝내기
            </button>
        </div>
    </div>
</div>

    // 화면 전환 함수
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // 시간 설정 및 직접 입력 이벤트 처리
    const timeInput = document.getElementById('time-input');

    function updateTimePresetHighlight(val) {
        document.querySelectorAll('.time-btn').forEach(b => {
            if (parseInt(b.getAttribute('data-time')) === val) {
                b.classList.remove('bg-gray-200', 'text-gray-700', 'border-transparent');
                b.classList.add('bg-blue-100', 'text-blue-700', 'border-blue-400', 'font-bold');
            } else {
                b.classList.remove('bg-blue-100', 'text-blue-700', 'border-blue-400', 'font-bold');
                b.classList.add('bg-gray-200', 'text-gray-700', 'border-transparent');
            }
        });
    }

    document.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const val = parseInt(this.getAttribute('data-time'));
            drawingTimeSetting = val;
            if (timeInput) timeInput.value = val;
            updateTimePresetHighlight(val);
        });
    });

    if (timeInput) {
        timeInput.addEventListener('input', function() {
            let val = parseInt(this.value);
            if (!isNaN(val) && val > 0) {
                drawingTimeSetting = val;
                updateTimePresetHighlight(val);
            }
        });

        timeInput.addEventListener('change', function() {
            let val = parseInt(this.value);
            if (isNaN(val) || val < 5) val = 5; // 최소 5초
            if (val > 600) val = 600; // 최대 10분(600초)
            this.value = val;
            drawingTimeSetting = val;
            updateTimePresetHighlight(val);
        });
    }

    // 카테고리 설정 버튼 이벤트
    function toggleCategory(btn, category) {
        if (selectedCategories.includes(category)) {
            if (selectedCategories.length <= 1) {
                alert('최소 1개의 카테고리는 선택해야 합니다!');
                return;
            }
            selectedCategories = selectedCategories.filter(c => c !== category);
            btn.classList.remove('bg-purple-100', 'text-purple-700', 'border-purple-400', 'font-bold');
            btn.classList.add('bg-gray-200', 'text-gray-700', 'border-transparent');
        } else {
            selectedCategories.push(category);
            btn.classList.remove('bg-gray-200', 'text-gray-700', 'border-transparent');
            btn.classList.add('bg-purple-100', 'text-purple-700', 'border-purple-400', 'font-bold');
        }
    }

    // 플레이어 추가
    function addPlayer() {
        const input = document.getElementById('player-input');
        const name = input.value.trim();
        if (name.length === 0) return;
        
        if (players.some(p => p.name === name)) {
            alert('이미 있는 이름입니다.');
            return;
        }

        players.push({ name: name, score: 0 });
        input.value = '';
        renderPlayerList();
    }

    // 플레이어 삭제
    function removePlayer(index) {
        players.splice(index, 1);
        renderPlayerList();
    }

    // 플레이어 목록 UI 업데이트
    function renderPlayerList() {
        const listDiv = document.getElementById('player-list');
        listDiv.innerHTML = '';
        players.forEach((player, index) => {
            const badge = document.createElement('div');
            badge.className = 'bg-blue-500 text-white px-3 py-1 rounded-full flex items-center gap-2 shadow-sm text-lg';
            badge.innerHTML = `
                ${player.name}
                <button onclick="removePlayer(${index})" class="text-white hover:text-red-300 font-bold ml-1">&times;</button>
            `;
            listDiv.appendChild(badge);
        });
    }

    // 배열 섞기 (피셔-예이츠 알고리즘)
    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    // 게임 시작
    function startGame() {
        if (players.length < 2) {
            // alert 대신 커스텀 경고창이 좋지만 구현 편의상 모달 대신 화면 텍스트 강조로 변경 가능
            // 여기서는 단순성을 위해 alert 사용을 지양하라고 했으므로 자체 모달 로직이나 텍스트 변화를 줍니다.
            const input = document.getElementById('player-input');
            input.placeholder = "최소 2명이 필요해요!";
            input.classList.add('border-red-500', 'bg-red-50');
            setTimeout(() => {
                input.classList.remove('border-red-500', 'bg-red-50');
                input.placeholder = "학생 이름 입력";
            }, 2000);
            return;
        }
        
        // 큐 초기화 (인덱스 배열 섞기)
        orderQueue = shuffleArray([...Array(players.length).keys()]);
        startNextRound();
    }

    // 다음 라운드 준비 (출제자 뽑기 화면)
    function startNextRound() {
        // 큐가 비었으면 다시 채우기 (모두가 한 번씩 함)
        if (orderQueue.length === 0) {
            orderQueue = shuffleArray([...Array(players.length).keys()]);
        }
        
        currentDrawerIndex = orderQueue.pop(); // 큐에서 한 명 뽑기
        
        // UI 초기화
        document.getElementById('word-reveal-box').classList.add('hidden');
        document.getElementById('the-word').classList.add('hidden');
        document.getElementById('btn-start-draw').classList.add('hidden');
        const rouletteBox = document.getElementById('roulette-box');
        rouletteBox.innerHTML = '<span class="text-gray-400">? ? ?</span>';
        rouletteBox.className = 'text-6xl my-10 h-20 flex items-center justify-center'; // 애니메이션 제거
        
        showScreen('screen-picker');
        
        // 룰렛 애니메이션 (시각적 재미)
        let ticks = 0;
        const maxTicks = 20; // 약 2초간
        const interval = setInterval(() => {
            const randomPlayer = players[Math.floor(Math.random() * players.length)].name;
            rouletteBox.innerHTML = `<span class="text-gray-400">${randomPlayer}</span>`;
            ticks++;
            
            if (ticks >= maxTicks) {
                clearInterval(interval);
                const actualDrawerName = players[currentDrawerIndex].name;
                rouletteBox.innerHTML = `🎉 <span class="roulette-text text-blue-600">${actualDrawerName}</span> 🎉`;
                
                // 1초 뒤에 제시어 확인 박스 표시
                setTimeout(() => {
                    document.getElementById('word-reveal-box').classList.remove('hidden');
                    pickRandomWord();
                }, 1000);
            }
        }, 100);
    }

    // 무작위 제시어 선택
    function pickRandomWord() {
        let availableWords = [];
        selectedCategories.forEach(cat => {
            if(wordDB[cat]) {
                availableWords = availableWords.concat(wordDB[cat]);
            }
        });
        
        if (availableWords.length === 0) {
            currentWord = "에러:단어없음";
        } else {
            const randomIndex = Math.floor(Math.random() * availableWords.length);
            currentWord = availableWords[randomIndex];
        }
        
        document.getElementById('the-word').innerText = currentWord;
    }

    // 제시어 보기 버튼 클릭
    function showWord() {
        document.getElementById('the-word').classList.remove('hidden');
        document.getElementById('btn-start-draw').classList.remove('hidden');
    }

    // 드로잉 모드 진입
    function enterDrawMode() {
        showScreen('screen-draw');
        document.getElementById('draw-current-player').innerText = players[currentDrawerIndex].name;
        document.getElementById('draw-current-word').innerText = currentWord;
        
        timeLeft = drawingTimeSetting;
        updateTimerDisplay();
        
        initCanvas();
        clearCanvas(); // 이전 그림 지우기
        
        // 타이머 시작
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 0) {
                finishDrawing();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerEl = document.getElementById('timer-display');
        timerEl.innerText = timeLeft;
        if (timeLeft <= 10) {
            timerEl.classList.remove('text-red-500');
            timerEl.classList.add('text-red-600', 'animate-pulse', 'scale-125', 'transition-transform');
        } else {
            timerEl.classList.add('text-red-500');
            timerEl.classList.remove('text-red-600', 'animate-pulse', 'scale-125', 'transition-transform');
        }
    }

    // 캔버스 초기화 및 이벤트 바인딩
    function initCanvas() {
        if (!canvas) {
            canvas = document.getElementById('drawing-canvas');
            ctx = canvas.getContext('2d');
            
            // 크기 조정 (부모 div에 맞춤)
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 이벤트 리스너 바인딩 (PC)
            canvas.addEventListener('mousedown', startPosition);
            canvas.addEventListener('mouseup', endPosition);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseout', endPosition); // 캔버스 밖으로 나가면 그리기 종료
            
            // 이벤트 리스너 바인딩 (터치/태블릿)
            canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
            canvas.addEventListener('touchend', endPosition);
            canvas.addEventListener('touchmove', handleTouchMove, {passive: false});
            canvas.addEventListener('touchcancel', endPosition);
        }
    }

    function resizeCanvas() {
        const container = document.getElementById('canvas-container');
        // 기존 그림 임시 저장 (리사이즈 시 날아가는 것 방지)
        let tempCanvas = document.createElement('canvas');
        let tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        if(canvas.width > 0) tempCtx.drawImage(canvas, 0, 0);

        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;

        // 배경색 흰색 설정
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 복원
        if(canvas.width > 0) ctx.drawImage(tempCanvas, 0, 0);
        
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }

    // 그리기 이벤트 핸들러
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;

        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }

        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startPosition(e) {
        isDrawing = true;
        const pos = getPointerPos(e);
        lastX = pos.x;
        lastY = pos.y;
        draw(e); // 점 하나만 찍을 때를 위해
    }

    function handleTouchStart(e) {
        e.preventDefault(); // 스크롤 등 기본 동작 방지
        startPosition(e);
    }

    function endPosition() {
        isDrawing = false;
        ctx.beginPath(); // 경로 초기화
    }

    function draw(e) {
        if (!isDrawing) return;
        
        const pos = getPointerPos(e);
        
        ctx.lineWidth = currentLineWidth;
        ctx.strokeStyle = currentColor;
        
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        
        lastX = pos.x;
        lastY = pos.y;
    }

    function handleTouchMove(e) {
        e.preventDefault(); // 스와이프 방지
        draw(e);
    }

    function clearCanvas() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 도구 버튼 설정 (색상 및 굵기)
    const customContainer = document.getElementById('custom-color-container');
    const customPicker = document.getElementById('custom-color-picker');

    function selectCustomColor(color) {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
        if (customContainer) {
            customContainer.classList.add('selected');
        }
        currentColor = color;
    }

    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            if (customContainer) customContainer.classList.remove('selected');
            this.classList.add('selected');
            currentColor = this.getAttribute('data-color');
        });
    });

    // 커스텀 색상 피커 이벤트 (터치 및 클릭 완벽 지원)
    if (customPicker) {
        ['input', 'change'].forEach(eventType => {
            customPicker.addEventListener(eventType, function(e) {
                selectCustomColor(e.target.value);
            });
        });
    }

    // 굵기 버튼 이벤트
    document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            const size = parseInt(this.getAttribute('data-size'));
            currentLineWidth = size;
            
            const slider = document.getElementById('brush-slider');
            const sizeText = document.getElementById('brush-size-text');
            if (slider) slider.value = size;
            if (sizeText) sizeText.innerText = size;
        });
    });

    // 굵기 슬라이더 이벤트
    const brushSlider = document.getElementById('brush-slider');
    const sizeText = document.getElementById('brush-size-text');
    if (brushSlider) {
        brushSlider.addEventListener('input', function(e) {
            const size = parseInt(e.target.value);
            currentLineWidth = size;
            if (sizeText) sizeText.innerText = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
        });
    }

    // 그리기 완료 (또는 시간 초과)
    function finishDrawing() {
        clearInterval(timerInterval);
        
        // 완성된 그림 이미지를 추출하여 감상 화면으로 전달
        const finalImg = document.getElementById('final-drawing-img');
        finalImg.src = canvas.toDataURL();
        
        // 다 같이 그림을 보는 감상 화면으로 이동
        showScreen('screen-guess');
    }

    // 정답 공개 및 점수 화면으로 이동
    function revealAnswer() {
        document.getElementById('score-answer').innerText = currentWord;
        renderScoreList();
        showScreen('screen-score');
    }

    // 점수 입력창 렌더링 (출제자 포함)
    function renderScoreList() {
        const listDiv = document.getElementById('score-list');
        listDiv.innerHTML = '';
        
        players.forEach((player, index) => {
            const isDrawer = (index === currentDrawerIndex);
            
            const card = document.createElement('div');
            card.className = `p-3 rounded-xl shadow-sm border-2 flex flex-col items-center gap-2 ${
                isDrawer ? 'bg-amber-50 border-amber-300' : 'bg-white border-gray-100'
            }`;
            card.innerHTML = `
                <div class="text-xl font-bold text-gray-700 flex items-center gap-1">
                    ${player.name}
                    ${isDrawer ? '<span class="text-xs bg-amber-200 text-amber-800 px-2 py-0.5 rounded-full font-normal">🎨 출제자</span>' : ''}
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="changeScore(${index}, -1)" class="w-10 h-10 rounded-full bg-red-100 text-red-600 font-bold text-xl hover:bg-red-200 transition-colors">-</button>
                    <span id="score-val-${index}" class="text-2xl font-bold w-8 text-center">${player.score}</span>
                    <button onclick="changeScore(${index}, 1)" class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 font-bold text-xl hover:bg-blue-200 transition-colors">+</button>
                </div>
            `;
            listDiv.appendChild(card);
        });
    }

    // 점수 변경
    function changeScore(playerIndex, amount) {
        players[playerIndex].score += amount;
        // 점수가 0 밑으로 내려가지 않게 할지 여부 (일단 허용하거나 0 최소값 설정)
        if (players[playerIndex].score < 0) players[playerIndex].score = 0; 
        
        document.getElementById(`score-val-${playerIndex}`).innerText = players[playerIndex].score;
    }

    // 리더보드 (순위표) 보기
    function showLeaderboard() {
        const listDiv = document.getElementById('leaderboard-list');
        listDiv.innerHTML = '';
        
        // 점수 기준 내림차순 정렬
        const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
        
        const medals = ['🥇', '🥈', '🥉'];
        
        sortedPlayers.forEach((player, idx) => {
            let rankIcon = '';
            if (idx < 3) rankIcon = medals[idx];
            else rankIcon = `<span class="text-gray-400 text-lg w-6 inline-block text-center">${idx + 1}</span>`;
            
            const item = document.createElement('div');
            item.className = 'flex justify-between items-center p-4 bg-gray-50 rounded-2xl border border-gray-200 shadow-sm';
            item.innerHTML = `
                <div class="flex items-center gap-4">
                    <div class="text-3xl">${rankIcon}</div>
                    <div class="text-2xl font-bold text-gray-700">${player.name}</div>
                </div>
                <div class="text-3xl font-bold text-purple-600">${player.score}<span class="text-lg text-gray-500 ml-1">점</span></div>
            `;
            listDiv.appendChild(item);
        });

        showScreen('screen-leaderboard');
        
        // 게임 완전 종료 상태인지 체크하여 '돌아가기' 버튼 조절
        // 여기서는 언제든 볼 수 있으므로 둡니다.
    }

    function backToScore() {
        showScreen('screen-score');
    }

    // 게임 완전히 끝내기 (초기화)
    function confirmEndGame() {
        // 커스텀 다이얼로그나 2번 묻기 대신 바로 초기화로 갑니다.
        players = [];
        orderQueue = [];
        renderPlayerList();
        showScreen('screen-setup');
    }

</script>
</body>
